! ==============================================================================
! KONFIGURASI OLT VSOL V1600GS-ZF (ZTE FALCON CHIPSET VARIANT)
! PERHATIAN KHUSUS SERI ZF:
! Wajib menyertakan "service-port 1 gemport 1 uservlan 20 vlan 20" di bawah profile line!
! Tanpa baris tersebut, frame PPPoE dari ONT akan di-drop oleh OLT.
! Uplink: GE 0/1, GE 0/2, GE 0/3 (speed 1000 full-duplex)
! VLAN 20: PPPoE Internet Pelanggan
! VLAN 30: Management OLT (192.168.30.2/24 Gateway: 192.168.30.1)
! ==============================================================================

frr version 8.0.1
frr defaults traditional
software V1.0.4-Wed, 26 Nov 2025 16:28:01 

vlan 1
exit
vlan 20
exit
vlan 30 
exit 

vlan 20
description PPPOE
exit

vlan 30
description MGMT
exit

interface vlan 1
ip address 192.168.8.200/24
exit 

interface vlan 30
ip address 192.168.30.2/24
exit 

ip gateway 192.168.30.1
ip dns 1.1.1.1 1.0.0.1
time zone 07:00
ntp server 103.83.142.30 14.102.153.110
dst continent asia location Jakarta
loopback detect enable  
loopback mode auto-recovery

profile dba id 128 name default1
type 3 assured 1024 maximum 1024000
exit

profile line id 1 name line_FTTH
  tcont 1 name tcont1 dba default1
    gemport 1 tcont 1 gemport_name gemport1
    gemport 1 encrypt disable
    gemport 1 state enable
      service ser_1 gemport 1 tag 20
      service-port 1 gemport 1 uservlan 20 vlan 20
commit
exit

interface gpon 0/1
loopback enable
onu auto-learn
onu auto-learn line-profile name line_FTTH
plug_and_play enable vlan 1
range min 0 max 200
exit

interface gpon 0/1
storm-control broadcast bps 1496
storm-control unknow bps 1496
p2p enable
no ip igmp snooping immediate-leave
als restart mode auto
als width 2
exit

onu auto-learn bind matching-type exact
onu auto-delete disable

interface gigabitEthernet 0/1
no shutdown
speed 1000
storm-control broadcast bps 1496
storm-control unknow bps 1496
no switchport isolate
switchport mode hybrid
switchport hybrid pvid vlan 1
switchport hybrid vlan 1 untagged
switchport hybrid vlan 20 tagged
switchport hybrid vlan 30 tagged
loopback enable
no ip igmp snooping immediate-leave
exit

interface gigabitEthernet 0/2
no shutdown
speed 1000
storm-control broadcast bps 1496
storm-control unknow bps 1496
no switchport isolate
switchport mode hybrid
switchport hybrid pvid vlan 1
switchport hybrid vlan 1 untagged
switchport hybrid vlan 20 tagged
switchport hybrid vlan 30 tagged
loopback enable
no ip igmp snooping immediate-leave
exit

interface gigabitEthernet 0/3
no shutdown
speed 10000
storm-control broadcast bps 1496
storm-control unknow bps 1496
no switchport isolate
switchport mode hybrid
switchport hybrid pvid vlan 1
switchport hybrid vlan 1 untagged
switchport hybrid vlan 20 tagged
switchport hybrid vlan 30 tagged
loopback enable
no ip igmp snooping immediate-leave
exit

snmp-server start
snmp-server community public ro 
snmp-server community private rw 
snmp-server notify notify inform inform inform 
snmp-server notify notify trap trap trap 
login-access-list deny telnet 0.0.0.0 0.0.0.0
login-access-list ipv6 deny telnet ::/0
login-access-list deny snmp 0.0.0.0 0.0.0.0
login-access-list ipv6 deny snmp ::/0
login-access-list enable 
fan temperature 37
fan mode open

alarm oamlog critical-event enable
alarm oamlog dying-gasp enable
alarm oamlog link-fault enable
alarm oamlog link-event disable
alarm oamlog organization-specific enable
queue-scheduler sp
lldp tx-interval 30
lldp tx-hold 4

interface gigabitEthernet 0/1
lldp rx-and-tx
exit

interface gigabitEthernet 0/2
lldp rx-and-tx
exit

interface gigabitEthernet 0/3
lldp rx-and-tx
exit

acl disable
acl ipv6 disable
ip igmp snooping version igmpv2
dhcp-relay information option disable
dhcp-relay information strategy keep
duid duid-llt
hostname OLT-VSOL-1PON
service integrated-vtysh-config
!
user manager
user login-password admin $1$7dqq.viO$Rsw.VZ8kbqMRz5RG18Gcg0
user enable-password admin $1$7dqq.viO$Rsw.VZ8kbqMRz5RG18Gcg0
exit
!
tacacs
exit
!
ip route 0.0.0.0/0 192.168.30.1
!
line vty
!
end
